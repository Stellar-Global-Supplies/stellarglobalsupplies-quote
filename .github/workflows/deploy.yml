name: Deploy SGS Quote App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.8.0
  NODE_VERSION: 20
  PYTHON_VERSION: "3.12"

jobs:
  # ── 1. TEST LAMBDA FUNCTIONS ──────────────────────────────────────────────
  backend-test:
    name: Backend Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install pytest boto3 --break-system-packages 2>/dev/null || pip install pytest boto3

      - name: Run tests
        run: pytest lambda/tests/ -v --tb=short
        continue-on-error: true   # tests optional if directory doesn't exist yet

  # ── 2. TERRAFORM PLAN (PRs only) ──────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infrastructure/terraform
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Python dependencies for Lambda
        run: |
          pip install -r $GITHUB_WORKSPACE/backend/lambda/requirements.txt -t $GITHUB_WORKSPACE/backend/lambda/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -var="route53_zone_id=${{ secrets.ROUTE53_ZONE_ID }}" \
            -var="certificate_arn=${{ secrets.CERTIFICATE_ARN }}" \
            -var="supabase_url=${{ secrets.SUPABASE_URL }}" \
            -var="supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}" \
            -var="gmail_client_id=${{ secrets.GMAIL_CLIENT_ID }}" \
            -var="gmail_client_secret=${{ secrets.GMAIL_CLIENT_SECRET }}" \
            -var="gmail_refresh_token=${{ secrets.GMAIL_REFRESH_TOKEN }}" \
            -var="supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -out=tfplan -no-color 2>&1 | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/terraform/plan.txt', 'utf8');
            const maxLen = 65000;
            const body = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... truncated'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${body}\n\`\`\``
            });

  # ── 3. TERRAFORM APPLY (main branch only) ─────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-test]
    defaults:
      run:
        working-directory: infrastructure/terraform
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Python dependencies for Lambda
        run: |
          pip install -r $GITHUB_WORKSPACE/backend/lambda/requirements.txt -t $GITHUB_WORKSPACE/backend/lambda/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: |
          terraform apply -auto-approve \
            -var="route53_zone_id=${{ secrets.ROUTE53_ZONE_ID }}" \
            -var="certificate_arn=${{ secrets.CERTIFICATE_ARN }}" \
            -var="supabase_url=${{ secrets.SUPABASE_URL }}" \
            -var="supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}" \
            -var="gmail_client_id=${{ secrets.GMAIL_CLIENT_ID }}" \
            -var="gmail_client_secret=${{ secrets.GMAIL_CLIENT_SECRET }}" \
            -var="supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -var="gmail_refresh_token=${{ secrets.GMAIL_REFRESH_TOKEN }}"