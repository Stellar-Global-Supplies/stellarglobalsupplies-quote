name: Deploy SGS Quote App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.8.0
  NODE_VERSION: 20
  PYTHON_VERSION: "3.12"

jobs:
  # ── 1. LINT & TYPE-CHECK FRONTEND ─────────────────────────────────────────
  frontend-check:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  # ── 2. TEST LAMBDA FUNCTIONS ──────────────────────────────────────────────
  backend-test:
    name: Backend Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install pytest boto3 --break-system-packages 2>/dev/null || pip install pytest boto3

      - name: Run tests
        run: pytest lambda/tests/ -v --tb=short
        continue-on-error: true   # tests optional if directory doesn't exist yet

  # ── 3. TERRAFORM PLAN (PRs only) ──────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -var="route53_zone_id=${{ secrets.ROUTE53_ZONE_ID }}" \
            -var="certificate_arn=${{ secrets.CERTIFICATE_ARN }}" \
            -var="supabase_url=${{ secrets.SUPABASE_URL }}" \
            -var="supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}" \
            -var="gmail_client_id=${{ secrets.GMAIL_CLIENT_ID }}" \
            -var="gmail_client_secret=${{ secrets.GMAIL_CLIENT_SECRET }}" \
            -var="gmail_refresh_token=${{ secrets.GMAIL_REFRESH_TOKEN }}" \
            -out=tfplan -no-color 2>&1 | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/terraform/plan.txt', 'utf8');
            const maxLen = 65000;
            const body = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... truncated'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${body}\n\`\`\``
            });

  # ── 4. TERRAFORM APPLY (main branch only) ─────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [frontend-check, backend-test]
    defaults:
      run:
        working-directory: infrastructure/terraform
    outputs:
      bucket_name: ${{ steps.tf-outputs.outputs.bucket_name }}
      cf_distribution_id: ${{ steps.tf-outputs.outputs.cf_distribution_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: |
          terraform apply -auto-approve \
            -var="route53_zone_id=${{ secrets.ROUTE53_ZONE_ID }}" \
            -var="certificate_arn=${{ secrets.CERTIFICATE_ARN }}" \
            -var="supabase_url=${{ secrets.SUPABASE_URL }}" \
            -var="supabase_anon_key=${{ secrets.SUPABASE_ANON_KEY }}" \
            -var="gmail_client_id=${{ secrets.GMAIL_CLIENT_ID }}" \
            -var="gmail_client_secret=${{ secrets.GMAIL_CLIENT_SECRET }}" \
            -var="gmail_refresh_token=${{ secrets.GMAIL_REFRESH_TOKEN }}"

      - name: Capture Terraform outputs
        id: tf-outputs
        run: |
          echo "bucket_name=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "cf_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

  # ── 5. BUILD & DEPLOY FRONTEND ────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: terraform-apply
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.BASE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ needs.terraform-apply.outputs.bucket_name }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          # index.html must NOT be cached (SPA routing)
          aws s3 cp dist/index.html s3://${{ needs.terraform-apply.outputs.bucket_name }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform-apply.outputs.cf_distribution_id }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "## ✅ Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://quote.stellarglobalsupplies.com" >> $GITHUB_STEP_SUMMARY
          echo "**Bucket:** ${{ needs.terraform-apply.outputs.bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**CF Distribution:** ${{ needs.terraform-apply.outputs.cf_distribution_id }}" >> $GITHUB_STEP_SUMMARY